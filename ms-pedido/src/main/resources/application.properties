spring.application.name=ms-pedido
server.port=8083

# ─── H2 DataSource ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:pedidodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── H2 Console ──────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Inicialización de datos ─────────────────────────────────────────────────
# defer-datasource-initialization: ejecuta data.sql DESPUÉS de que Hibernate
# crea el esquema (necesario en Spring Boot 3 con ddl-auto != none)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ─── RabbitMQ / CloudAMQP ────────────────────────────────────────────────────
# spring.rabbitmq.addresses acepta la URL completa amqps:// y configura
# el SSL/TLS automáticamente (forma recomendada por CloudAMQP)
spring.rabbitmq.addresses=amqps://TU_USUARIO:TU_PASSWORD@TU_HOST.rmq.cloudamqp.com/TU_USUARIO

# ─── Nombres de Exchange / Queues (compartidos entre microservicios) ──────────
rabbitmq.exchange.pedidos=pedidos.exchange
rabbitmq.queue.pedido-creado=pedido.creado.queue
rabbitmq.queue.pago-resultado=pago.resultado.queue
rabbitmq.queue.stock-descontar=stock.descontar.queue
rabbitmq.routing-key.pedido-creado=pedido.creado
rabbitmq.routing-key.pago-resultado=pago.resultado
rabbitmq.routing-key.stock-descontar=stock.descontar
